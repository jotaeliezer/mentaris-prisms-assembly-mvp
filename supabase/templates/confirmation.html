<!--
  Supabase → Authentication → Emails → Templates → Confirm signup
  Subject: Welcome to Mentaris
  Paste the markup below into the message body.
-->
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#060816;margin:0;padding:32px 16px;font-family:Segoe UI,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;background:#0c1020;border:1px solid rgba(0,210,255,0.35);border-radius:16px;">
        <tr>
          <td style="padding:32px 28px 8px;color:#ffffff;font-size:28px;font-weight:700;letter-spacing:3px;text-transform:uppercase;">
            Mentaris
          </td>
        </tr>
        <tr>
          <td style="padding:0 28px 24px;color:rgba(232,236,255,0.78);font-size:13px;letter-spacing:2px;text-transform:uppercase;">
            Prisms of Assembly
          </td>
        </tr>
        <tr>
          <td style="padding:0 28px 12px;color:#f4fbff;font-size:18px;font-weight:700;">
            Welcome to the belt.
          </td>
        </tr>
        <tr>
          <td style="padding:0 28px 24px;color:rgba(232,236,255,0.88);font-size:15px;line-height:1.5;">
            Your pilot account is ready. Confirm this email and the assemblies you build stay with you, on this device and the next.
          </td>
        </tr>
        <tr>
          <td style="padding:0 28px 28px;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 18px;border-radius:12px;background:#00d7ff;color:#061018;font-size:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase;text-decoration:none;">
              Confirm and enter
            </a>
          </td>
        </tr>
        <tr>
          <td style="padding:0 28px 28px;color:rgba(232,236,255,0.55);font-size:12px;line-height:1.5;">
            This link was sent to {{ .Email }}. If you did not create a Mentaris account, you can ignore this message.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
